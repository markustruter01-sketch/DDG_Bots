name: tests
on: [push, pull_request]
jobs:
  safety-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (images; the only add-on these tests need)
        run: python -m pip install pillow
      - name: Safety, PC worker, bot tools, routines and crypto tests
        run: python -m unittest tests.test_security tests.test_pc_worker tests.test_bot_tools tests.test_routines tests.test_crypto_paper tests.test_crypto_v4 tests.test_crypto_replay -v
